name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm test

  native-linux-v4-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/windows/Hch.Worker.Portable.Tests/packages.lock.json
            src/windows/Hch.Worker.{Core,IPC.Contracts,Ollama,Persistence,Protocol,Security}/packages.lock.json

      - name: Restore exact locked portable dependencies
        # The shared project locks also serve the Windows build and therefore
        # retain their existing win-x64 target. The test assembly itself remains
        # framework-dependent net10.0 and is executed by the Linux host below.
        run: dotnet restore src/windows/Hch.Worker.Portable.Tests/Hch.Worker.Portable.Tests.csproj --locked-mode --runtime win-x64

      - name: Build and test portable .NET contracts
        run: |
          dotnet build src/windows/Hch.Worker.Portable.Tests/Hch.Worker.Portable.Tests.csproj \
            --configuration Release \
            --no-restore
          dotnet test src/windows/Hch.Worker.Portable.Tests/Hch.Worker.Portable.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Build native service host
        shell: powershell
        run: ./ops/windows/editorial-worker/Build-HchWorkerService.ps1
      - name: Test Windows worker
        run: npm run test:windows

  native-windows-v4:
    runs-on: windows-latest
    env:
      WIX_EULA_ACCEPTED: ${{ vars.WIX_EULA_ACCEPTED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            .config/dotnet-tools.json
            src/windows/**/packages.lock.json
            src/windows/**/packages.wix.lock.json

      - name: Validate WiX command-line source guards
        shell: pwsh
        run: |
          ./scripts/windows/Test-HchWorkerInstallerSource.ps1
          ./scripts/windows/Test-HchWorkerReleaseWorkflow.ps1

      - name: Restore exact locked .NET dependencies
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Tool restore failed.' }
          dotnet restore src/windows/Hch.Worker.sln --locked-mode --runtime win-x64 -p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { throw 'Locked solution restore failed.' }

      - name: Restore exact WiX dependencies after organizational acceptance
        if: vars.WIX_EULA_ACCEPTED == 'wix7'
        shell: pwsh
        run: |
          dotnet restore src/windows/Hch.Worker.Installer/Hch.Worker.Installer.wixproj --locked-mode -p:AcceptEula=wix7
          if ($LASTEXITCODE -ne 0) { throw 'Locked WiX restore failed.' }

      - name: Record deferred WiX binary gate
        if: vars.WIX_EULA_ACCEPTED != 'wix7'
        shell: pwsh
        run: |
          @"
          WiX binary restore is intentionally deferred because WIX_EULA_ACCEPTED is not wix7.
          Native source, dependency, formatting and test gates continue to run. MSI packaging and
          every signing/release path remain fail-closed until organizational acceptance is recorded.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Enforce formatting and dependency vulnerability gates
        shell: pwsh
        run: |
          dotnet format src/windows/Hch.Worker.sln --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Formatting verification failed.' }
          ./scripts/windows/Test-HchWorkerDependencies.ps1 `
            -SolutionPath src/windows/Hch.Worker.sln `
            -EvidencePath artifacts/windows-v4/ci/dependency-vulnerability-scan.json

      - name: Build and test native Windows Worker
        shell: pwsh
        run: |
          $versionProperties = @(
            '-p:Version=4.0.0',
            '-p:AssemblyVersion=4.0.0.0',
            '-p:FileVersion=4.0.0.0'
          )
          dotnet build src/windows/Hch.Worker.sln `
            --configuration Release `
            --no-restore `
            @versionProperties
          if ($LASTEXITCODE -ne 0) { throw 'Native solution build failed.' }
          dotnet test src/windows/Hch.Worker.Tests/Hch.Worker.Tests.csproj `
            --configuration Release `
            --runtime win-x64 `
            --no-restore `
            @versionProperties
          if ($LASTEXITCODE -ne 0) { throw 'Native test suite failed.' }
