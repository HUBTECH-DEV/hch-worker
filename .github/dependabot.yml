version: 2

# Agrupamento é obrigatório aqui, não preferência de estilo.
#
# Sem grupo, o Dependabot abre um pull request por dependência. Além do volume,
# isso quebra pares de ações que precisam subir juntas: `github/codeql-action/init`
# e `github/codeql-action/analyze` são dependências distintas para o Dependabot,
# mas a mesma action em execução, e o CodeQL recusa rodar com as duas em versões
# diferentes. Em HUBTECH-DEV/hubicg-community isso travou dois pull requests que
# se bloqueavam mutuamente, sem que fechar um destravasse o outro.
#
# O grupo específico vem sempre antes do curinga: o Dependabot atribui cada
# dependência ao primeiro grupo cujo padrão casar.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      # Major fica separado de propósito. Agrupar tudo sob um curinga junta
      # correção de segurança com quebra de compatibilidade no mesmo pull
      # request: quando o major quebra o build, a correção de segurança fica
      # refém dele, e o Dependabot deixa de abrir pull request de segurança
      # dedicado porque considera que já existe um cobrindo a versão vulnerável.
      #
      # Com a separação, minor e patch — que é onde a maior parte das correções
      # de segurança chega — seguem mergeáveis sozinhos.
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      production-major:
        dependency-type: production
        update-types: ["major"]
        patterns:
          - "*"
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      development-major:
        dependency-type: development
        update-types: ["major"]
        patterns:
          - "*"
